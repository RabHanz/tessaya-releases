name: Desktop release

# Builds the desktop app from the private source at `ref` and publishes it here, where installs update from.
# Logs stay minimal: build steps print pass or fail only (.github/quiet.sh). Nothing but the release binaries leaves a run.
on:
  workflow_dispatch:
    inputs:
      version: { description: "X.Y.Z (release tag baton-vX.Y.Z)", required: true, type: string }
      ref: { description: "Source commit to build", required: true, type: string }
      dry_run: { description: "Build only, publish nothing", type: boolean, default: false }

permissions:
  contents: write
  actions: write

concurrency:
  group: desktop-${{ inputs.version }}
  cancel-in-progress: false

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
  VERSION: ${{ inputs.version }}
  Q: bash ../.github/quiet.sh

defaults:
  run:
    shell: bash
    working-directory: src

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check version
        working-directory: .
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; } && [[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit sha"; exit 1; }'
      - uses: actions/checkout@v6
        with: { persist-credentials: false, sparse-checkout: .github }
      - name: Source
        working-directory: .
        env: { KEY: "${{ secrets.SOURCE_DEPLOY_KEY }}" }
        run: bash .github/source.sh "${{ inputs.ref }}"
      - uses: actions/setup-node@v4
        with: { node-version-file: src/package.json }
      - if: matrix.name == 'windows'
        uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - if: matrix.name == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with: { vulkan_version: 1.4.363.1, install_runtime: false, cache: false }
      - if: matrix.name == 'linux'
        run: $Q "linux prerequisites" bash -c 'sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick build-essential cmake libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxkbcommon-dev libevdev-dev libclang-dev'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.name == 'windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
      - run: $Q branding bash scripts/tessaya/apply-release-branding.sh
      - name: Public T3 Connect config
        run: bash scripts/tessaya/hosted-public-config.sh >> "$GITHUB_ENV" 2>/dev/null && echo pass
      - run: $Q install bash -c 'corepack enable && pnpm install --frozen-lockfile'
      - run: $Q "memory model" node scripts/tessaya/fetch-memory-model.mjs
      - name: Build
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          b() { $Q "build $1 $3" node scripts/build-desktop-artifact.ts --platform "$1" --target "$2" --arch "$3" --build-version "$VERSION" --output-dir "$4" --verbose; }
          case "${{ matrix.name }}" in
            linux) b linux AppImage x64 release ;;
            windows) b win nsis x64 release ;;
            macos) b mac dmg arm64 release && b mac dmg x64 release-x64 && mv release-x64/latest-mac.yml release-x64/latest-mac-x64.yml && mv release-x64/* release/ ;;
          esac
      - run: $Q "no private layer" node scripts/tessaya/check-no-private-layer.mjs apps/desktop/dist-electron apps/server/dist apps/web/dist
      - name: Keep only the release binaries
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) ! -name 'builder-*.yml' -exec cp {} "$RUNNER_TEMP/out/" \;
          $Q "nothing private in the text files" node scripts/tessaya/guard-private.mjs --files "$RUNNER_TEMP"/out/*.yml
          ls "$RUNNER_TEMP/out" | wc -l
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: "${{ runner.temp }}/out/*", retention-days: 1, if-no-files-found: error }

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish
        run: |
          tag="baton-v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/* --clobber > /dev/null
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main --latest dist/* --title "Tessaya desktop v$VERSION" \
              --notes "Tessaya desktop app v$VERSION. Source ${{ inputs.ref }}. Unsigned build: Windows SmartScreen and macOS Gatekeeper warn on first run." > /dev/null
          fi
          echo published
  cleanup:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete this run's artifacts
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}" && echo done
